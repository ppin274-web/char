
name: Build CharmiKitty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project and build
        run: |
          unzip -oq 다운로드.zip -d .
          chmod +x KakaoTheme/gradlew
          cd KakaoTheme
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CharmiKitty-Android-APK
          path: KakaoTheme/build/outputs/apk/debug/*.apk
