name: CharmiKitty Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract ZIP
        run: |
          unzip -q 다운로드.zip -d unpacked

      - name: Build APK
        run: |
          cd unpacked/KakaoTheme
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: CharmiKitty-APK
          path: unpacked/KakaoTheme/build/outputs/apk/debug/*.apk
